# Sound manifest: one row per shipped sound asset (48). Read by build.py and check.py.
#
# source kinds
#   moodist:<path>   original recording in github.com/remvze/moodist at the pinned commit below.
#                    Never committed (redistribution of the Pixabay-sourced originals is a grey
#                    area); fetched on demand, or taken from --src-dir, and verified by sha256.
#   synth:<name>     generated here (see lib/synth.py): green noise, and the binaural pairs
#                    (pure sines, whole-Hz carriers, 10 s, so the loop is exact). Parameters
#                    live in [sound.synth]. No original is read for these.
#
# rule
#   integrated  integrated loudness = target_lufs (-20), true peak <= ceiling
#   binaural    integrated loudness = binaural_lufs (-24), no trim/cap/crossfade, stereo
#   body        level from the steady body of the sound: median short-term loudness =
#               R + level_offset_db, R = median over the integrated-rule sounds of their
#               median short-term loudness; rare pops are soft-clipped. Used for the five
#               transient sounds only (fire, office, keyboard, typewriter, clock).
#
# Optional per-row fields: loop_start_s / loop_end_s (loop points, seconds into the decoded
# original at 44.1 kHz; when set they replace the automatic head/tail trim; for binaural
# rows they only slice), xfade_s (default: 2.0, or 0.5 when the loop is under 15 s),
# cap_s, q (Vorbis quality: 1 for the eleven sounds with codec-sensitive content, 8 for the
# binaural pure tones, 0 otherwise; see QUALITY.md / DECISIONS 13), q default 0, level_offset_db (default 0),
# max_quiet_s (longest allowed quiet stretch, default 2.0; an override needs a comment).

[meta]
moodist_repo = "remvze/moodist"
moodist_commit = "11c0be2200116a3635880d600fd6953899cc51a3"
sample_rate = 44100
target_lufs = -20.0
binaural_lufs = -24.0
tolerance_lu = 0.5
true_peak_ceiling_dbtp = -1.0
size_budget_bytes = 16000000
binaural_min_separation_db = 40.0

[defaults]
cap_s = 90.0
q = 0
level_offset_db = 0.0
max_quiet_s = 2.0

[[sound]]
key = "alpha-8hz"
asset = "assets/sounds/binaural/alpha-8hz.ogg"
source = "synth:binaural"
rule = "binaural"
q = 8

[sound.synth]
left_hz = 200
right_hz = 208
seconds = 10

